name: Toggle Site Mode

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Site mode"
        required: true
        type: choice
        options:
          - requesting
          - haunting

jobs:
  toggle:
    name: Toggle site mode to ${{ inputs.mode }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update siteConfig.json
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('src/_data/siteConfig.json', 'utf8'));
            config.mode = '${{ inputs.mode }}';
            if ('${{ inputs.mode }}' === 'haunting') {
              config.jackIsGone = true;
              config.tagline = 'Jack is haunting you now.';
              config.description = 'Jack has passed. Browse the Wall of Haunts to see who he is visiting.';
            }
            fs.writeFileSync('src/_data/siteConfig.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/siteConfig.json
          git commit -m "Toggle site mode to ${{ inputs.mode }}"
          git push
