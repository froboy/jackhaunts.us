name: Accessibility Audit

on:
  pull_request:

jobs:
  a11y:
    name: WCAG AAA audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run pa11y-ci
        run: npx pa11y-ci --config .pa11yci.json
